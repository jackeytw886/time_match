<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>第七關 · 時光對對碰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   第七關 · 時光對對碰 —— 宜蘭考古文物【光導拉線】連連看
   設計語彙：發光電路、地底考古光塵、極致光譜導軌（沿用參考版）
   內容：六件真實文物照片 · 三遺址 · 名稱→意義→遺址 三段
   ============================================================ */
:root{
  --soil-dark:#0b0907; --soil-deep:#16120e; --soil-medium:#261f17;
  --gold-glow:#f0b44d; --gold-dim:#7c5e2d;
  --site-kiwulan:#bde038;  /* 淇武蘭：螢光黃綠 */
  --site-hanben:#ff7235;   /* 漢本：赤鐵礦紅橘 */
  --site-wanshan:#00f5ff;  /* 丸山：玉髓藍 */
  --bg-glow:radial-gradient(circle at 50% 40%, #2f2316 0%, #0b0907 80%);
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;touch-action:none;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--soil-dark);background-image:var(--bg-glow);
  color:#f5eedc;overflow:hidden;width:100vw;height:100vh;position:relative;}

#ambient-glow{position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(circle at 15% 25%, rgba(189,224,56,.045) 0%, transparent 45%),
            radial-gradient(circle at 85% 75%, rgba(0,245,255,.05) 0%, transparent 45%),
            radial-gradient(circle at 60% 90%, rgba(255,114,53,.045) 0%, transparent 45%);}

/* 頂部儀表 */
header{position:absolute;top:0;left:0;width:100%;height:84px;z-index:20;
  background:linear-gradient(to bottom, rgba(11,9,7,.95) 0%, rgba(11,9,7,0) 100%);
  display:flex;justify-content:space-between;align-items:center;padding:0 40px;
  border-bottom:1px solid rgba(240,180,77,.12);}
.brand{display:flex;align-items:center;gap:15px;}
.brand-badge{font-family:'Orbitron',sans-serif;font-weight:800;font-size:20px;letter-spacing:2px;
  background:linear-gradient(135deg,var(--gold-glow),#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.title-main{font-size:25px;font-weight:900;color:#fff;letter-spacing:2px;text-shadow:0 0 15px rgba(240,180,77,.4);}
.hud-panel{display:flex;align-items:center;gap:28px;background:rgba(22,18,14,.85);
  border:1px solid rgba(240,180,77,.25);padding:10px 25px;border-radius:30px;box-shadow:0 6px 30px rgba(0,0,0,.6);}
.hud-item{display:flex;align-items:center;gap:10px;}
.hud-label{font-size:13px;color:#baab9a;font-weight:500;letter-spacing:1px;}
.hud-val{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:800;color:var(--gold-glow);text-shadow:0 0 8px rgba(240,180,77,.6);}
.lives-container{display:flex;gap:8px;}
.life-led{width:14px;height:14px;border-radius:50%;background:#251e18;border:2px solid #44372b;
  transition:all .4s cubic-bezier(.175,.885,.32,1.275);}
.life-led.active{background:#ff3b30;border-color:#ffa19b;box-shadow:0 0 12px #ff3b30, inset 0 0 4px #fff;}

/* 任務列 */
.task-bar{position:absolute;top:84px;left:0;width:100%;height:58px;z-index:20;text-align:center;
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;}
.task-step{font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:4px;color:var(--gold-glow);}
.task-ask{font-size:22px;font-weight:700;color:#fff;}
.task-ask b{color:var(--gold-glow);font-weight:900;}
.task-dots{display:flex;gap:9px;margin-top:3px;}
.task-dots .d{width:9px;height:9px;border-radius:50%;background:rgba(245,238,220,.22);transition:.3s;}
.task-dots .d.done{background:var(--gold-glow);}
.task-dots .d.now{background:#fff;box-shadow:0 0 8px var(--gold-glow);transform:scale(1.25);}

/* 展台 */
#game-container{position:absolute;top:158px;bottom:24px;left:40px;right:40px;z-index:10;
  display:flex;justify-content:space-between;align-items:center;gap:90px;}
.column{width:33%;height:100%;display:flex;flex-direction:column;justify-content:space-between;gap:12px;}

.card{flex:1;background:rgba(22,18,14,.65);border:1px solid rgba(255,255,255,.06);border-radius:18px;
  padding:12px 16px;position:relative;display:flex;align-items:center;gap:16px;cursor:pointer;
  transition:all .4s cubic-bezier(.25,.8,.25,1);box-shadow:0 4px 20px rgba(0,0,0,.4);}
.card:hover{background:rgba(38,31,23,.85);border-color:rgba(240,180,77,.3);transform:scale(1.02);
  box-shadow:0 12px 30px rgba(0,0,0,.6), 0 0 15px rgba(240,180,77,.12);}
.card.selected{background:rgba(240,180,77,.12);border-color:var(--gold-glow);
  box-shadow:0 0 30px rgba(240,180,77,.35), inset 0 0 12px rgba(240,180,77,.15);}
.card.matched{cursor:default;pointer-events:none;background:rgba(240,180,77,.14);
  border-color:var(--gold-glow);
  box-shadow:0 0 30px rgba(240,180,77,.45), inset 0 0 16px rgba(240,180,77,.14);
  animation:litPop .45s cubic-bezier(.175,.885,.32,1.275);}
.card.lit{border-color:var(--gold-glow);background:rgba(240,180,77,.1);
  box-shadow:0 0 24px rgba(240,180,77,.34), inset 0 0 12px rgba(240,180,77,.1);
  animation:litPop .45s cubic-bezier(.175,.885,.32,1.275);}
.card.matched .card-title,.card.lit .card-title{color:var(--gold-glow);text-shadow:0 0 10px rgba(240,180,77,.5);}
.card.matched .card-desc,.card.lit .card-desc{color:#f6e2b4;}
.card.matched .card-img-wrap{border-color:var(--gold-glow);box-shadow:0 0 14px rgba(240,180,77,.3);}
@keyframes litPop{0%{transform:scale(1);}45%{transform:scale(1.035);}100%{transform:scale(1);}}
.right-col .card{justify-content:center;text-align:center;padding:14px 22px;}

/* 文物照片框 */
.card-img-wrap{width:88px;height:88px;border-radius:14px;flex-shrink:0;overflow:hidden;
  border:1px solid rgba(255,255,255,.1);background:#120d08;transition:all .4s ease;}
.card-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.card:hover .card-img-wrap{border-color:rgba(240,180,77,.3);box-shadow:0 0 14px rgba(240,180,77,.18);}
.card-info{flex-grow:1;min-width:0;}
.card-title{font-size:20px;font-weight:800;color:#fff;letter-spacing:1px;}
.card-title.dim{color:#8a7c6b;font-weight:700;font-size:17px;}
.card-title.serif{font-family:'Noto Serif TC',serif;}
.card-desc{font-size:15px;color:#e4d8c9;line-height:1.5;font-weight:400;}
.card-sitebig{font-family:'Noto Serif TC',serif;font-size:26px;font-weight:900;letter-spacing:1px;}

/* 端口 */
.port{width:24px;height:24px;border-radius:50%;background:#181410;border:3.5px solid #483d32;
  position:absolute;top:50%;transform:translateY(-50%);z-index:15;cursor:crosshair;transition:all .3s ease;
  display:flex;align-items:center;justify-content:center;}
.port::after{content:'';width:6px;height:6px;border-radius:50%;background:#fff;opacity:.4;transition:all .3s ease;}
.left-col .port{right:-12px;} .right-col .port{left:-12px;}
.card.selected .port,.port:hover{border-color:var(--gold-glow);box-shadow:0 0 15px var(--gold-glow);background:#fff;}
.card.selected .port::after,.port:hover::after{background:var(--gold-glow);opacity:1;}
.card.matched .port,.card.lit .port{border-color:var(--gold-glow) !important;background:var(--gold-glow) !important;box-shadow:0 0 18px var(--gold-glow);}
.card.matched .port::after,.card.lit .port::after{background:#fff;opacity:1;}

/* 遺址光標籤 */
.site-tag{font-size:12px;font-weight:800;padding:3px 10px;border-radius:20px;letter-spacing:1px;display:inline-block;}
.site-kiwulan{border:1px solid var(--site-kiwulan);color:var(--site-kiwulan);background:rgba(189,224,56,.08);}
.site-hanben{border:1px solid var(--site-hanben);color:var(--site-hanben);background:rgba(255,114,53,.08);}
.site-wanshan{border:1px solid var(--site-wanshan);color:var(--site-wanshan);background:rgba(0,245,255,.08);}

/* SVG 連線層 */
#svg-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;}
.connection-line{fill:none;stroke-linecap:round;}
.pulse-line{fill:none;stroke:#fff;stroke-dasharray:15,30;animation:fiberFlow 1s linear infinite;opacity:.85;}
@keyframes fiberFlow{to{stroke-dashoffset:-45;}}
@keyframes errorShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
.shake-anim{animation:errorShake .4s ease-in-out;}

/* 遮罩 */
.overlay{position:fixed;inset:0;background:rgba(8,6,5,.96);display:flex;flex-direction:column;
  justify-content:center;align-items:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .5s ease;}
.overlay.active{opacity:1;pointer-events:auto;}
.panel-container{background:radial-gradient(circle at 50% 25%, #34281b 0%, #110e0a 100%);
  border:2px solid var(--gold-glow);box-shadow:0 0 60px rgba(240,180,77,.25), inset 0 0 25px rgba(240,180,77,.08);
  border-radius:28px;width:min(680px,92vw);padding:45px;text-align:center;}
.panel-title{font-size:34px;font-weight:900;color:#fff;margin-bottom:12px;letter-spacing:3px;text-shadow:0 0 20px rgba(240,180,77,.5);}
.panel-sub{font-size:15px;color:#ccbead;line-height:1.7;margin-bottom:28px;}
.badge-art{font-size:72px;margin-bottom:22px;filter:drop-shadow(0 0 15px rgba(240,180,77,.35));animation:floatMotion 3s ease-in-out infinite;}
@keyframes floatMotion{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.montage{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;}
.montage img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:2px solid rgba(240,180,77,.35);}
.rewards-grid{display:flex;justify-content:space-around;gap:15px;margin-bottom:32px;}
.reward-card{flex:1;background:rgba(11,9,7,.7);border:1px solid rgba(240,180,77,.2);border-radius:14px;
  padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;}
.reward-icon{font-size:28px;} .reward-lbl{font-size:11px;color:#a59583;letter-spacing:1px;} .reward-val{font-size:16px;font-weight:800;color:#fff;}
.btn-primary{background:linear-gradient(135deg,#f0b44d 0%, #aa7422 100%);color:#0b0907;font-size:18px;font-weight:900;
  border:none;border-radius:35px;padding:15px 50px;cursor:pointer;box-shadow:0 4px 20px rgba(240,180,77,.35);
  transition:all .3s ease;letter-spacing:2px;}
.btn-primary:hover{transform:scale(1.05);box-shadow:0 6px 30px rgba(240,180,77,.55);}
.btn-primary:active{transform:scale(.98);}

@media (max-aspect-ratio:1/1){
  #game-container{gap:40px;} .column{width:42%;}
  .card-img-wrap{width:64px;height:64px;} .card-title{font-size:16px;} .card-desc{font-size:13px;}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
</style>
</head>
<body>
  <div id="ambient-glow"></div>

  <header>
    <div class="brand">
      <div class="brand-badge">STAGE 07</div>
      <div class="title-main">時光對對碰</div>
    </div>
    <div class="hud-panel">
      <div class="hud-item"><span class="hud-label">本段進度</span><span class="hud-val" id="progress-val">0 / 6</span></div>
      <div class="hud-item"><span class="hud-label">探測用時</span><span class="hud-val" id="timer-val">00:00</span></div>
      <div class="hud-item"><span class="hud-label">穩定儀能量</span><div class="lives-container" id="lives-container"></div></div>
    </div>
  </header>

  <div class="task-bar">
    <span class="task-step" id="task-step">STAGE 1</span>
    <span class="task-ask" id="task-ask">拖曳文物，連到正確的<b>名稱</b></span>
    <div class="task-dots" id="task-dots"></div>
  </div>

  <main id="game-container">
    <div class="column left-col" id="left-cards"></div>
    <div class="column right-col" id="right-cards"></div>
  </main>

  <svg id="svg-canvas"><defs>
    <filter id="neon-gold" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="neon-kiwulan" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="neon-hanben" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="neon-wanshan" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="neon-red" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs></svg>

  <div id="start-overlay" class="overlay active">
    <div class="panel-container">
      <div class="badge-art">🏺</div>
      <h2 class="panel-title">時光對對碰</h2>
      <p class="panel-sub">宜蘭三大遺址埋藏著璀璨的時光。按住文物的<b style="color:var(--gold-glow)">發光端口</b>拉線到正確答案，或<b style="color:var(--gold-glow)">點兩端</b>快速配對。<br>三段任務：先連<b style="color:var(--gold-glow)">名稱</b>，再連<b style="color:var(--gold-glow)">代表意義</b>，最後牽回<b style="color:var(--gold-glow)">發現遺址</b>。</p>
      <button class="btn-primary" onclick="startGame()">啟動光導探測</button>
    </div>
  </div>

  <div id="result-overlay" class="overlay">
    <div class="panel-container">
      <div class="badge-art" id="result-badge">🏆</div>
      <h2 class="panel-title" id="result-title">發掘完成</h2>
      <p class="panel-sub" id="result-sub"></p>
      <div class="montage" id="montage"></div>
      <div class="rewards-grid" id="rewards-grid"></div>
      <button class="btn-primary" onclick="restartGame()">重新檢測</button>
    </div>
  </div>

/* ============================================================ 音效（沿用參考版 Web Audio） */
const AudioSynth = {
  ctx:null, init(){ if(!this.ctx) this.ctx=new (window.AudioContext||window.webkitAudioContext)(); },
  playSelect(){ this.init();const n=this.ctx.currentTime;const o=this.ctx.createOscillator();const g=this.ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(440,n);o.frequency.exponentialRampToValueAtTime(880,n+.1);
    g.gain.setValueAtTime(.06,n);g.gain.exponentialRampToValueAtTime(.001,n+.12);o.connect(g);g.connect(this.ctx.destination);o.start(n);o.stop(n+.12); },
  playSuccess(){ this.init();const n=this.ctx.currentTime;[523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o=this.ctx.createOscillator();const g=this.ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(f,n+i*.06);g.gain.setValueAtTime(.1,n+i*.06);g.gain.exponentialRampToValueAtTime(.001,n+i*.06+.5);
    o.connect(g);g.connect(this.ctx.destination);o.start(n+i*.06);o.stop(n+i*.06+.55);}); },
  playError(){ this.init();const n=this.ctx.currentTime;const o1=this.ctx.createOscillator();const o2=this.ctx.createOscillator();const fl=this.ctx.createBiquadFilter();const g=this.ctx.createGain();
    o1.type='sawtooth';o2.type='sawtooth';o1.frequency.setValueAtTime(120,n);o2.frequency.setValueAtTime(122,n);
    fl.type='lowpass';fl.frequency.setValueAtTime(500,n);fl.frequency.exponentialRampToValueAtTime(60,n+.4);
    g.gain.setValueAtTime(.18,n);g.gain.exponentialRampToValueAtTime(.001,n+.45);
    o1.connect(fl);o2.connect(fl);fl.connect(g);g.connect(this.ctx.destination);o1.start(n);o2.start(n);o1.stop(n+.45);o2.stop(n+.45); },
  playWin(){ this.init();const n=this.ctx.currentTime;[523.25,587.33,659.25,783.99,880,987.77,1046.5,1318.51,1567.98].forEach((f,i)=>{const o=this.ctx.createOscillator();const g=this.ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(f,n+i*.08);g.gain.setValueAtTime(.06,n+i*.08);g.gain.exponentialRampToValueAtTime(.001,n+i*.08+.4);
    o.connect(g);g.connect(this.ctx.destination);o.start(n+i*.08);o.stop(n+i*.08+.45);}); }
};

/* ============================================================ 引擎 */
let state = null;
let dndBound = false;

function startGame(){ document.getElementById('start-overlay').classList.remove('active'); initGame(); }
function restartGame(){ document.getElementById('result-overlay').classList.remove('active'); initGame(); }

function initGame(){
  state = { round:0, wrongAttempts:0, secondsPassed:0, timerInterval:null,
            selectedLeftId:null, selectedRightId:null, matches:{}, done:false,
            isDragging:false, dragStartSide:null, dragStartId:null };
  document.getElementById('timer-val').textContent='00:00';
  buildDots(); renderLives(); loadRound();
  clearInterval(state.timerInterval);
  state.timerInterval=setInterval(()=>{ state.secondsPassed++;
    const m=String(Math.floor(state.secondsPassed/60)).padStart(2,'0');
    const s=String(state.secondsPassed%60).padStart(2,'0');
    document.getElementById('timer-val').textContent=`${m}:${s}`; },1000);
  registerDragAndDrop();
  window.removeEventListener('resize',updateAllLines);
  window.addEventListener('resize',updateAllLines);
}

function buildDots(){
  const box=document.getElementById('task-dots'); box.innerHTML='';
  ROUNDS.forEach(()=>{const d=document.createElement('span');d.className='d';box.appendChild(d);});
}
function renderLives(){
  const c=document.getElementById('lives-container'); c.innerHTML='';
  const rem=CFG.MAX_WRONG-state.wrongAttempts;
  for(let i=0;i<CFG.MAX_WRONG;i++){const l=document.createElement('div');l.className='life-led'+(i<rem?' active':'');c.appendChild(l);}
}

function loadRound(){
  const r=ROUNDS[state.round];
  state.matches={}; state.selectedLeftId=null; state.selectedRightId=null;
  clearConnections();
  document.getElementById('task-step').textContent=r.step;
  document.getElementById('task-ask').innerHTML=r.ask;
  document.getElementById('progress-val').textContent=`0 / ${ARTIFACTS.length}`;
  document.querySelectorAll('#task-dots .d').forEach((d,i)=>d.className='d'+(i<state.round?' done':i===state.round?' now':''));
  renderCards();
  requestAnimationFrame(updateAllLines);
}

function renderCards(){
  const r=ROUNDS[state.round];
  const leftCol=document.getElementById('left-cards');
  const rightCol=document.getElementById('right-cards');
  const showName = r.type!=='name';

  leftCol.innerHTML = shuffle(ARTIFACTS).map(a=>`
    <div class="card" id="card-left-${a.id}" data-side="left" data-id="${a.id}">
      <div class="card-img-wrap"><img src="${a.img}" alt="${a.name}"></div>
      <div class="card-info">
        ${showName ? `<div class="card-title serif">${a.name}</div>`
                   : `<div class="card-title dim">？ 待辨識文物</div>`}
      </div>
      <div class="port" id="port-left-${a.id}" data-side="left" data-id="${a.id}"></div>
    </div>`).join('');

  let entries;
  if(r.type==='site'){
    entries = SITE_LIST.map(s=>({key:s.key, html:`<div class="card-sitebig" style="color:${siteVar(s.key)}">${s.name}</div>`}));
  } else if(r.type==='name'){
    entries = ARTIFACTS.map(a=>({key:a.id, html:`<div class="card-title serif">${a.name}</div>`}));
  } else {
    entries = ARTIFACTS.map(a=>({key:a.id, html:`<div class="card-desc">${a.meaning}</div>`}));
  }
  rightCol.innerHTML = shuffle(entries).map(e=>`
    <div class="card" id="card-right-${e.key}" data-side="right" data-id="${e.key}">
      <div class="card-info">${e.html}</div>
      <div class="port" id="port-right-${e.key}" data-side="right" data-id="${e.key}"></div>
    </div>`).join('');
}

/* ---- 鎖定判定 ---- */
function isLocked(side,id){
  const r=ROUNDS[state.round];
  if(side==='left') return !!state.matches[id];
  if(r.type==='site') return false;            // 遺址節點可接收多條線
  return !!state.matches[id];                  // 名稱/意義為一對一
}

/* ============================================================ 座標與曲線（沿用參考版） */
function getPortCoords(side,id){
  const p=document.getElementById(`port-${side}-${id}`);
  if(!p) return {x:0,y:0};
  const r=p.getBoundingClientRect();
  return { x:r.left+r.width/2+window.scrollX, y:r.top+r.height/2+window.scrollY };
}
function drawBezierPath(x1,y1,x2,y2){
  const c=Math.max(40,Math.abs(x2-x1)*0.45);
  return `M ${x1} ${y1} C ${x1+c} ${y1}, ${x2-c} ${y2}, ${x2} ${y2}`;
}

/* ============================================================ 拖曳 + 點擊（沿用參考版，調整鎖定/key 邏輯） */
function registerDragAndDrop(){
  if(dndBound) return; dndBound=true;
  const container=document.getElementById('game-container');
  const onDown=(e)=>{
    if(state.done) return;
    const port=e.target.closest('.port');
    const card=e.target.closest('.card');
    if(port){
      e.stopPropagation();
      const side=port.dataset.side, id=port.dataset.id;
      if(isLocked(side,id)) return;
      state.isDragging=true; state.dragStartSide=side; state.dragStartId=id;
      AudioSynth.playSelect(); highlightSelection(side,id); createDragLine(side,id,e);
      return;
    }
    if(card){
      const side=card.dataset.side, id=card.dataset.id;
      if(isLocked(side,id)) return;
      AudioSynth.playSelect();
      if(side==='left'){
        if(state.selectedLeftId===id){clearHi('left',id);state.selectedLeftId=null;}
        else{ if(state.selectedLeftId)clearHi('left',state.selectedLeftId);
          state.selectedLeftId=id; document.getElementById(`card-left-${id}`).classList.add('selected'); }
      }else{
        if(state.selectedRightId===id){clearHi('right',id);state.selectedRightId=null;}
        else{ if(state.selectedRightId)clearHi('right',state.selectedRightId);
          state.selectedRightId=id; document.getElementById(`card-right-${id}`).classList.add('selected'); }
      }
      if(state.selectedLeftId && state.selectedRightId) evaluateMatch(state.selectedLeftId,state.selectedRightId);
    }
  };
  const onMove=(e)=>{
    if(!state.isDragging) return;
    const dl=document.getElementById('drag-temp-line'); if(!dl) return;
    const s=getPortCoords(state.dragStartSide,state.dragStartId);
    const cx=e.touches?e.touches[0].clientX:e.clientX, cy=e.touches?e.touches[0].clientY:e.clientY;
    dl.setAttribute('d', state.dragStartSide==='left'?drawBezierPath(s.x,s.y,cx,cy):drawBezierPath(cx,cy,s.x,s.y));
  };
  const onUp=(e)=>{
    if(!state.isDragging) return; state.isDragging=false;
    const dl=document.getElementById('drag-temp-line'); if(dl) dl.remove();
    const cx=e.changedTouches?e.changedTouches[0].clientX:e.clientX, cy=e.changedTouches?e.changedTouches[0].clientY:e.clientY;
    const t=document.elementFromPoint(cx,cy); const tc=t?t.closest('.card'):null;
    if(tc){
      const tSide=tc.dataset.side, tId=tc.dataset.id;
      if(tSide!==state.dragStartSide){
        const leftId = state.dragStartSide==='left'?state.dragStartId:tId;
        const rightId= state.dragStartSide==='right'?state.dragStartId:tId;
        if(!isLocked('left',leftId)){ evaluateMatch(leftId,rightId); clearHi(state.dragStartSide,state.dragStartId); return; }
      }
    }
    clearHi(state.dragStartSide,state.dragStartId);
    if(state.dragStartSide==='left') state.selectedLeftId=null; else state.selectedRightId=null;
  };
  container.addEventListener('mousedown',onDown);
  window.addEventListener('mousemove',onMove);
  window.addEventListener('mouseup',onUp);
  container.addEventListener('touchstart',onDown,{passive:false});
  window.addEventListener('touchmove',onMove,{passive:false});
  window.addEventListener('touchend',onUp,{passive:false});
}
function highlightSelection(side,id){
  if(side==='left'){ if(state.selectedLeftId)clearHi('left',state.selectedLeftId);
    state.selectedLeftId=id; const c=document.getElementById(`card-left-${id}`); c&&c.classList.add('selected'); }
  else{ if(state.selectedRightId)clearHi('right',state.selectedRightId);
    state.selectedRightId=id; const c=document.getElementById(`card-right-${id}`); c&&c.classList.add('selected'); }
}
function clearHi(side,id){ const c=document.getElementById(`card-${side}-${id}`); if(c)c.classList.remove('selected'); }
function createDragLine(side,id,e){
  const svg=document.getElementById('svg-canvas'); const s=getPortCoords(side,id);
  const cx=e.touches?e.touches[0].clientX:e.clientX, cy=e.touches?e.touches[0].clientY:e.clientY;
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('id','drag-temp-line'); p.setAttribute('class','connection-line');
  p.setAttribute('stroke','rgba(240,180,77,.55)'); p.setAttribute('stroke-width','8');
  p.setAttribute('stroke-dasharray','8,8'); p.setAttribute('fill','none'); p.setAttribute('filter','url(#neon-gold)');
  p.setAttribute('d', side==='left'?drawBezierPath(s.x,s.y,cx,cy):drawBezierPath(cx,cy,s.x,s.y));
  svg.appendChild(p);
}

/* ============================================================ 配對判定與連線 */
function evaluateMatch(leftId,rightId){
  const r=ROUNDS[state.round];
  const lc=document.getElementById(`card-left-${leftId}`);
  const rc=document.getElementById(`card-right-${rightId}`);
  if(lc) lc.classList.remove('selected'); if(rc) rc.classList.remove('selected');

  const art=artById(leftId);
  const ok = r.type==='site' ? (art && art.siteType===rightId) : (leftId===rightId);

  if(ok){
    state.matches[leftId]=rightId;
    AudioSynth.playSuccess();
    if(lc) lc.classList.add('matched');
    if(rc) rc.classList.add(r.type!=='site' ? 'matched' : 'lit');   // 兩邊都亮金；遺址節點亮起但不鎖
    createPermanentLine(leftId,rightId,siteVar(art.siteType),`neon-${art.siteType}`);
    const n=Object.keys(state.matches).length;
    document.getElementById('progress-val').textContent=`${n} / ${ARTIFACTS.length}`;
    if(n===ARTIFACTS.length) setTimeout(nextRound,820);
  }else{
    AudioSynth.playError(); state.wrongAttempts++; renderLives();
    createErrorLine(leftId,rightId);
    if(lc) lc.classList.add('shake-anim'); if(rc) rc.classList.add('shake-anim');
    setTimeout(()=>{lc&&lc.classList.remove('shake-anim');rc&&rc.classList.remove('shake-anim');},450);
    if(state.wrongAttempts>=CFG.MAX_WRONG) setTimeout(endGameFail,820);
  }
  state.selectedLeftId=null; state.selectedRightId=null;
}

function createPermanentLine(leftId,rightId,color,filterId){
  const svg=document.getElementById('svg-canvas');
  const s=getPortCoords('left',leftId), e=getPortCoords('right',rightId);
  const d=drawBezierPath(s.x,s.y,e.x,e.y);
  const blur=mkLine(d,color,16,`blur-line-${leftId}`); blur.setAttribute('filter',`url(#${filterId})`); svg.appendChild(blur);
  const core=mkLine(d,'#fff',7,`core-line-${leftId}`); svg.appendChild(core);
  const pulse=mkLine(d,null,8,`pulse-line-${leftId}`); pulse.classList.add('pulse-line'); svg.appendChild(pulse);
}
function mkLine(d,stroke,w,id){
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('class','connection-line permanent-line'); p.setAttribute('id',id);
  p.setAttribute('d',d); if(stroke)p.setAttribute('stroke',stroke); p.setAttribute('stroke-width',w); return p;
}
function createErrorLine(leftId,rightId){
  const svg=document.getElementById('svg-canvas');
  const s=getPortCoords('left',leftId), e=getPortCoords('right',rightId);
  const p=mkLine(drawBezierPath(s.x,s.y,e.x,e.y),'#ff3b30',12,'err'+Date.now());
  p.setAttribute('filter','url(#neon-red)'); svg.appendChild(p);
  setTimeout(()=>{p.style.transition='opacity .4s ease';p.style.opacity='0';setTimeout(()=>p.remove(),400);},400);
}
function updateAllLines(){
  Object.keys(state.matches).forEach(leftId=>{
    const rightId=state.matches[leftId];
    const s=getPortCoords('left',leftId), e=getPortCoords('right',rightId);
    const d=drawBezierPath(s.x,s.y,e.x,e.y);
    ['blur','core','pulse'].forEach(k=>{const el=document.getElementById(`${k}-line-${leftId}`); if(el)el.setAttribute('d',d);});
  });
}
function clearConnections(){ document.querySelectorAll('.permanent-line').forEach(l=>l.remove()); }

/* ============================================================ 回合與結算 */
function nextRound(){
  state.round++;
  if(state.round>=ROUNDS.length){ finishGame(); return; }
  loadRound();
}
function finishGame(){
  state.done=true; clearInterval(state.timerInterval); AudioSynth.playWin();
  const fast=state.secondsPassed<=CFG.BONUS_SEC;
  document.getElementById('result-badge').textContent='🏅';
  document.getElementById('result-title').textContent=CFG.TITLE;
  document.getElementById('result-sub').textContent='完美的時光導軌探測！你牽起了宜蘭三大史前遺址、六件文物的古老故事。';
  document.getElementById('montage').innerHTML=ARTIFACTS.map(a=>`<img src="${a.img}" alt="${a.name}">`).join('');
  const m=String(Math.floor(state.secondsPassed/60)).padStart(2,'0'), s=String(state.secondsPassed%60).padStart(2,'0');
  document.getElementById('rewards-grid').innerHTML=`
    <div class="reward-card"><div class="reward-icon">📜</div><div class="reward-lbl">發掘稱號</div><div class="reward-val" style="color:var(--gold-glow)">${CFG.TITLE}</div></div>
    <div class="reward-card"><div class="reward-icon">⏱️</div><div class="reward-lbl">考古用時</div><div class="reward-val">${m}:${s}</div></div>
    <div class="reward-card" style="opacity:${fast?'1':'.5'}"><div class="reward-icon">${fast?'🍦':'❄️'}</div><div class="reward-lbl">${fast?'特獎達成':'未達時限'}</div><div class="reward-val">${fast?'冰棒一枝！':'再快一點'}</div></div>`;
  document.getElementById('result-overlay').classList.add('active');
}
function endGameFail(){
  state.done=true; clearInterval(state.timerInterval); AudioSynth.playError();
  document.getElementById('result-badge').textContent='⚡';
  document.getElementById('result-title').textContent='探測超載';
  document.getElementById('result-sub').textContent=`穩定儀已超載發生 ${CFG.MAX_WRONG} 次錯誤。深埋宜蘭的遠古記憶仍等著你重現！`;
  document.getElementById('montage').innerHTML='';
  const doneRounds=state.round, total=ARTIFACTS.length;
  document.getElementById('rewards-grid').innerHTML=`
    <div class="reward-card" style="border-color:rgba(255,59,48,.4)"><div class="reward-icon">⚠️</div><div class="reward-lbl">穩定儀過載</div><div class="reward-val" style="color:#ff3b30">${state.wrongAttempts} 次</div></div>
    <div class="reward-card" style="opacity:.7"><div class="reward-icon">⛏️</div><div class="reward-lbl">本段進度</div><div class="reward-val">${Object.keys(state.matches).length} / ${total}</div></div>`;
  document.getElementById('result-overlay').classList.add('active');
}
</script>
</body>
